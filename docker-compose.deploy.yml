# EC2 운영용 compose — 소스 빌드 없이 GHCR 에서 받은 이미지를 실행합니다.
# (로컬 개발용 빌드 compose 는 docker-compose.yml 을 사용하세요)
# CD 워크플로우(.github/workflows/cd.yml)가 이 파일로 pull & up 합니다.
services:
  mysql:
    image: mysql:8.0
    container_name: pawmesh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pawmesh-net

  redis:
    image: redis:7-alpine
    container_name: pawmesh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pawmesh-net

  app:
    # CD 가 push 한 이미지. 특정 커밋으로 롤백하려면 .env 에 APP_IMAGE_TAG=<git-sha> 지정
    image: ghcr.io/pawmesh/pawmesh-backend:${APP_IMAGE_TAG:-develop}
    container_name: pawmesh-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 이미지 저장소(S3) — 실제 값은 .env 로 주입
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # 외부 AI(OpenAI)
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY}
      # JWT 서명 시크릿
      JWT_SECRET: ${JWT_SECRET}
      # 프론트엔드 CORS 허용 Origin (콤마 구분). 미설정 시 localhost 개발 origin 으로 동작.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    networks:
      - pawmesh-net

volumes:
  mysql-data:
  # 기존 MySQL 볼륨 재사용 시 external 지정:
  # mysql-data:
  #   external: true
  #   name: <기존_볼륨_이름>

networks:
  pawmesh-net:
    driver: bridge
