# PawMesh Backend — 앱 + MySQL 통합 구성
# 실행: docker compose --env-file .env up -d --build
# 종료: docker compose down        (데이터 유지)  /  docker compose down -v (볼륨까지 삭제)
services:
  mysql:
    image: mysql:8.0
    container_name: pawmesh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 외부에서 DB 직접 접속이 필요 없으면 이 줄을 지워 보안을 강화하세요.
      - "3306:3306"
    volumes:
      # 기존에 띄워둔 MySQL 데이터를 그대로 쓰려면, 아래 볼륨 이름을
      # 기존 볼륨명으로 바꾸거나 external 볼륨으로 지정하세요. (맨 아래 volumes 주석 참고)
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pawmesh-net

  redis:
    image: redis:7-alpine
    container_name: pawmesh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      # 외부에서 Redis 직접 접속이 필요 없으면 이 줄을 지워 보안을 강화하세요.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pawmesh-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pawmesh-backend:latest
    container_name: pawmesh-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql            # compose 네트워크 내 MySQL 서비스명
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis         # compose 네트워크 내 Redis 서비스명
      REDIS_PORT: 6379
      # 이미지 저장소(S3) — 실제 값은 .env 로 주입
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # 외부 AI(OpenAI)
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY}
      # JWT 서명 시크릿
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    networks:
      - pawmesh-net

volumes:
  mysql-data:
  # 기존 MySQL 볼륨을 재사용하려면 위 줄 대신 아래처럼 external 로 지정:
  # mysql-data:
  #   external: true
  #   name: <기존_볼륨_이름>

networks:
  pawmesh-net:
    driver: bridge
