spring:
  application:
    name: pawmesh-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pawmesh}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # MVP 단계: 엔티티 기준 스키마 자동 반영. 운영 안정화 시 validate + Flyway/Liquibase 권장
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      # 강아지 사진 업로드 제한 (OpenAI images/edits 제약과 맞춤 — 25MB 미만)
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 8080

# 애플리케이션 커스텀 설정
app:
  signup:
    # 회원가입 세션 / AI job 의 Redis TTL (분)
    session-ttl-minutes: 30
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:pawmesh-dev}
  openai:
    api-key: ${OPEN_AI_API_KEY:}
    image-model: gpt-image-1
    chat-model: gpt-4o
  jwt:
    # 필수 환경변수. 미설정 시 기동 실패(fail-fast). HS256 서명을 위해 최소 32바이트 이상.
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 3600        # 1시간
    refresh-token-validity-seconds: 1209600     # 14일

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  packages-to-scan: com.pawmesh.backend
  paths-to-match: /**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
