name: CD

# develop 브랜치에 push 되면:
#  1) GitHub Actions 에서 Docker 이미지 빌드 → GHCR push
#  2) EC2 에 SSH 접속 → 새 이미지 pull → docker compose 재기동
on:
  push:
    branches: [develop]

concurrency:
  group: deploy-develop
  cancel-in-progress: false   # 배포 중 취소 방지

env:
  IMAGE_NAME: ghcr.io/pawmesh/pawmesh-backend   # GHCR 경로는 소문자여야 함

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # GHCR push 권한
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64   # EC2 가 ARM(Graviton)이면 linux/arm64 로 변경
          tags: |
            ${{ env.IMAGE_NAME }}:develop
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (deploy compose 전송용)
        uses: actions/checkout@v4

      - name: Copy deploy compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "docker-compose.deploy.yml,Caddyfile"
          target: ~/pawmesh-backend/

      - name: Deploy on EC2 (pull & up)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/pawmesh-backend
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.deploy.yml --env-file .env pull
            docker compose -f docker-compose.deploy.yml --env-file .env up -d
            docker image prune -f
            docker logout ghcr.io
